# ============================================================
#  FirestEventowki - przedmioty eventowe
#  Kolory: kody z & (np. &6 &l), kolory HEX: &#ff8800
#  Resource pack: Firest-Pack.zip (bez niego item-model pokaze fioletowa kratke!)
# ============================================================

pouch:
  lifetime-minutes: 15          # po tylu minutach przedmiot w torbie znika
  button-name: "&a&lWYPŁAĆ WSZYSTKO"
  button-lore:
    - "&7Kliknij, aby przenieść wszystkie"
    - "&7przedmioty do swojego ekwipunku."
    - ""
    - "&7Przedmiotów w torbie: &e%n%"
  expire-line: "&c⌛ Znika za: &e%czas%"

totem:
  lose-ratio: 0.5               # jaka czesc przedmiotow gracz traci przy smierci z totemem

armor:
  set-bonus:
    enabled: true               # bonus za zalozenie calego kompletu (4 elementy)
    effects:                    # NAZWA:POZIOM (poziom 0 = I)
      - "FIRE_RESISTANCE:0"
      - "SPEED:0"

panel:
  title: "&6&lPanel Eventówek"

messages:
  prefix: "&8[&6Eventówki&8] "
  no-permission: "&cNie masz uprawnień do tej komendy."
  only-player: "&cTa komenda jest tylko dla graczy."
  usage: "&7Użycie: &f/firestareventowki give (gracz) (item) [ilość] &8| &fpanel &8| &flista &8| &freload"
  player-offline: "&cGracz &f%gracz% &cnie jest online."
  unknown-item: "&cNie ma takiego itemu. Wpisz &f/firestareventowki lista"
  given: "&aDano &f%gracz% &8» &e%ilosc%x %item%"
  reloaded: "&aPrzeładowano konfigurację."
  list-header: "&7Dostępne itemy: &f%lista%"
  panel-given: "&aOtrzymałeś: &f%item%"
  pouch-captured: "&6Przedmioty ofiary trafiły do torby &7(&e%n%&7)"
  pouch-full: "&cTwoja torba jest pełna - reszta łupów wypadła na ziemię."
  pouch-withdrawn: "&aWypłacono &e%n% &aprzedmiotów z torby."
  pouch-nothing: "&cTorba jest pusta."
  pouch-inv-full: "&cMasz pełny ekwipunek - część przedmiotów została w torbie."
  totem-used: "&c&lTOTEM &7ocalił połowę Twojego ekwipunku!"
  totem-restored: "&aOdzyskałeś część przedmiotów dzięki totemowi."

